# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: '3'
tasks:
  rebuild:
    desc: Rebuild the nix-darwin configuration from this flake
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - sudo darwin-rebuild switch --flake .

  bootstrap:
    desc: First-time nix-darwin activation on a machine (handles unknown hostnames)
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      # The nix-darwin homebrew module aborts activation if brew is missing.
      - |
        if ! command -v brew >/dev/null 2>&1 && [ ! -x /opt/homebrew/bin/brew ]; then
          echo "Homebrew is not installed, and the homebrew module needs it." >&2
          echo "Run ./install.sh, or install it directly:" >&2
          echo '  /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"' >&2
          exit 1
        fi
      # `--flake .` resolves darwinConfigurations.$(hostname -s), and macOS
      # hostnames differ per machine. Fall back to the `default` attribute so a
      # brand-new Mac can activate before being added to darwinHosts.
      - |
        host="$(hostname -s)"
        if nix eval --raw ".#darwinConfigurations.${host}.system.outPath" >/dev/null 2>&1; then
          name="${host}"
        else
          echo "Hostname '${host}' is not in darwinHosts; using .#default." >&2
          echo "Add it to flake.nix to make a bare '--flake .' work here." >&2
          name="default"
        fi
        target=".#${name}"
        echo "Activating ${target}"
        # Build as the invoking user, then activate as root. Deliberately not
        # `sudo nix run nix-darwin -- switch`, for two reasons:
        #   - `nix run nix-darwin` resolves through the flake *registry*, so it
        #     activates with whatever nix-darwin that points at rather than the
        #     `darwin` input this flake pins. On a fresh machine they disagree.
        #   - macOS sudo resets PATH to a system default with no nix on it, so
        #     the binary has to be named by absolute path regardless.
        # Building first also keeps the download out of root's context; the
        # store is shared, so the switch below is a cache hit.
        system="$(nix build ".#darwinConfigurations.${name}.system" --no-link --print-out-paths)"
        sudo "${system}/sw/bin/darwin-rebuild" switch --flake "${target}"

  hosts:
    desc: List the hostnames this flake can configure
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - |
        echo "This machine: $(hostname -s)"
        echo "Configured:"
        nix eval .#darwinConfigurations --apply builtins.attrNames --json |
          tr -d '[]"' | tr ',' '\n' | sed 's/^/  /'
